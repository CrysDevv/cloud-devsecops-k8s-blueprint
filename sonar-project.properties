# Configuración base de SonarQube / SonarCloud para microservicios del blueprint.
# En CI se sobreescriben sonar.projectKey, sonar.sources y sonar.tests según el runtime.
sonar.projectKey=cloud-devsecops-k8s-blueprint
sonar.projectName=cloud-devsecops-k8s-blueprint
sonar.sourceEncoding=UTF-8

# Exclusiones comunes de infraestructura, dependencias y artefactos generados
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test_**.py,**/*Test.java,infra/**,observability/**,docs/**

# Umbral mínimo de cobertura exigido por el Quality Gate
sonar.coverage.exclusions=**/main.ts,**/main.py,**/*Application.java,**/config/**,**/dto/**

# Rutas de reportes de cobertura por lenguaje
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
