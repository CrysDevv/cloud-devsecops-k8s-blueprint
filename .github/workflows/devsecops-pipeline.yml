name: DevSecOps Blueprint Pipeline

on:
  workflow_call:
    inputs:
      runtime:
        description: "Runtime del microservicio: java17 | node20 | python312"
        required: true
        type: string
      service_path:
        description: "Ruta relativa al código fuente del microservicio"
        required: false
        type: string
        default: "."
      image_name:
        description: "Nombre de la imagen OCI (sin tag)"
        required: true
        type: string
      app_port:
        description: "Puerto interno en el que escucha el microservicio"
        required: false
        type: number
        default: 8080
      health_path:
        description: "Endpoint de healthcheck (/actuator/health o /health)"
        required: false
        type: string
        default: "/health"
      blueprint_ref:
        description: "Tag o rama del repositorio blueprint"
        required: false
        type: string
        default: "v1.0.0"
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

  workflow_dispatch:
    inputs:
      validate_blueprint_only:
        description: "Validar solo IaC (Terraform + Helm) del blueprint"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  packages: write

env:
  DOCKER_BUILDKIT: "1"
  TRIVY_NO_PROGRESS: "true"

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: Validación estática de IaC (Terraform + Helm + Trivy Misconfig)
  # -------------------------------------------------------------------------
  iac-security-lint:
    name: IaC Lint & Security Scan (Terraform + Helm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blueprint
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Format & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Helm Lint & Template Render
        run: |
          helm lint infra/helm/microservice-base -f infra/helm/microservice-base/ci/ci-values.yaml
          mkdir -p /tmp/rendered-k8s
          helm template blueprint-ci infra/helm/microservice-base \
            -f infra/helm/microservice-base/ci/ci-values.yaml \
            > /tmp/rendered-k8s/manifests.yaml

      - name: Trivy IaC Misconfiguration Scan (Terraform & Helm)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # -------------------------------------------------------------------------
  # JOB 2: Unit Tests (>80% Coverage) & SonarQube SAST
  # -------------------------------------------------------------------------
  test-and-sast:
    name: Unit Tests (>80% Coverage) & SonarQube
    if: ${{ !inputs.validate_blueprint_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        if: ${{ inputs.runtime == 'java17' }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Run Java Tests & Verify >80% JaCoCo Coverage
        if: ${{ inputs.runtime == 'java17' }}
        working-directory: ${{ inputs.service_path }}
        run: |
          mvn -B -ntp test jacoco:report jacoco:check \
            -Djacoco.haltOnFailure=true \
            -Djacoco.dataFile=target/jacoco.exec

      - name: Setup Node.js 20
        if: ${{ inputs.runtime == 'node20' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"
          cache-dependency-path: "${{ inputs.service_path }}/package-lock.json"

      - name: Run Node Tests & Verify >80% Coverage
        if: ${{ inputs.runtime == 'node20' }}
        working-directory: ${{ inputs.service_path }}
        run: |
          npm ci --ignore-scripts
          npm test -- --coverage --coverageReporters=lcov --coverageReporters=text-summary \
            --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}'

      - name: Setup Python 3.12
        if: ${{ inputs.runtime == 'python312' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: "pip"
          cache-dependency-path: "${{ inputs.service_path }}/requirements.txt"

      - name: Run Python Tests & Verify >80% Coverage
        if: ${{ inputs.runtime == 'python312' }}
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80

      - name: SonarQube SAST & Quality Gate Scan
        uses: SonarSource/sonarqube-scan-action@v4
        working-directory: ${{ inputs.service_path }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------------
  # JOB 3: Build Hardened Image, Verify Hardening, Syft SBOM & Trivy Image
  # -------------------------------------------------------------------------
  build-sbom-and-image-scan:
    name: Build Hardened Image, SBOM (Syft) & Trivy Scan
    if: ${{ !inputs.validate_blueprint_only }}
    needs: [iac-security-lint, test-and-sast]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4
        with:
          path: service

      - name: Checkout blueprint repository
        uses: actions/checkout@v4
        with:
          repository: CrysDevv/cloud-devsecops-k8s-blueprint
          ref: ${{ inputs.blueprint_ref }}
          path: blueprint

      - name: Compute immutable image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "image_tag=${{ inputs.image_name }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Image & Run Hardening Assertions
        run: |
          chmod +x blueprint/scripts/*.sh
          APP_VERSION="${GITHUB_SHA::12}" \
          VCS_REF="${GITHUB_SHA}" \
          APP_PORT="${{ inputs.app_port }}" \
          blueprint/scripts/build-image.sh \
            "${{ inputs.runtime }}" \
            "service/${{ inputs.service_path }}" \
            "${{ steps.meta.outputs.image_tag }}"

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ steps.meta.outputs.image_tag }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.runtime }}-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Trivy Vulnerability Scan (Image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image_tag }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Save built image for DAST stage
        run: |
          docker save "${{ steps.meta.outputs.image_tag }}" -o /tmp/app-image.tar

      - name: Upload ephemeral image tarball
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-image-${{ github.sha }}
          path: /tmp/app-image.tar
          retention-days: 1

  # -------------------------------------------------------------------------
  # JOB 4: Dynamic Application Security Testing (DAST - OWASP ZAP)
  # -------------------------------------------------------------------------
  dast-owasp-zap:
    name: DAST Dynamic Scan (OWASP ZAP Baseline)
    if: ${{ !inputs.validate_blueprint_only }}
    needs: [build-sbom-and-image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blueprint rules
        uses: actions/checkout@v4
        with:
          repository: CrysDevv/cloud-devsecops-k8s-blueprint
          ref: ${{ inputs.blueprint_ref }}

      - name: Download built image tarball
        uses: actions/download-artifact@v4
        with:
          name: ephemeral-image-${{ github.sha }}
          path: /tmp

      - name: Start hardened container in isolated Docker network
        run: |
          docker load -i /tmp/app-image.tar
          docker network create dast-net
          docker run -d \
            --name dast-target \
            --network dast-net \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e APP_PORT="${{ inputs.app_port }}" \
            -e SERVER_PORT="${{ inputs.app_port }}" \
            -e PORT="${{ inputs.app_port }}" \
            "${{ needs.build-sbom-and-image-scan.outputs.image_tag }}"

          echo "Esperando a que el servicio responda en ${{ inputs.health_path }}..."
          for i in $(seq 1 30); do
            if docker run --rm --network dast-net curlimages/curl:8.10.1 \
              -fsS "http://dast-target:${{ inputs.app_port }}${{ inputs.health_path }}" >/dev/null 2>&1; then
              echo "Servicio saludable y listo para DAST."
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              echo "ERROR: El contenedor no pasó el healthcheck en el tiempo esperado." >&2
              docker logs dast-target
              exit 1
            fi
            sleep 2
          done

      - name: Run OWASP ZAP Baseline Scan against hardened container
        run: |
          mkdir -p zap-report
          chmod 777 zap-report
          docker run --rm \
            --network dast-net \
            -v "$(pwd)/zap-report:/zap/wrk:rw" \
            -v "$(pwd)/.zap-rules.tsv:/zap/wrk/.zap-rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "http://dast-target:${{ inputs.app_port }}" \
              -c .zap-rules.tsv \
              -r zap-baseline-report.html \
              -J zap-baseline-report.json \
              -I

      - name: Upload OWASP ZAP DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report-${{ github.sha }}
          path: zap-report/
          retention-days: 30

      - name: Cleanup DAST containers and network
        if: always()
        run: |
          docker rm -f dast-target >/dev/null 2>&1 || true
          docker network rm dast-net >/dev/null 2>&1 || true
