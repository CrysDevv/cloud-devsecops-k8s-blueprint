# Configuración completa de Prometheus (Fase 3).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector-apps
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: app-direct-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
