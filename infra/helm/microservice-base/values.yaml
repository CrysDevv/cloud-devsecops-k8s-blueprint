# Valores por defecto del chart microservice-base.
# image.repository es OBLIGATORIO (el chart falla con un mensaje claro si falta).

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

replicaCount: 2            # se ignora si autoscaling.enabled = true
revisionHistoryLimit: 5

image:
  repository: ""
  tag: ""                  # por defecto Chart.appVersion
  digest: ""               # si se define (sha256:...), tiene prioridad sobre tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

containerPort: 8080

serviceAccount:
  create: true
  automount: false         # el pod no recibe token de la API de Kubernetes
  name: ""
  annotations: {}          # IRSA: eks.amazonaws.com/role-arn: arn:aws:iam::<cuenta>:role/<rol>

podAnnotations: {}
podLabels: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
lifecycle:
  preStopSleepSeconds: 5   # da tiempo a que el Service retire el endpoint antes de SIGTERM

strategy:
  maxSurge: 25%
  maxUnavailable: 0

# Endurecimiento: coincide con las imágenes de docker/ (UID 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

# /tmp en memoria (rootfs de solo lectura). Cuenta contra el límite de memoria del contenedor.
tmpDir:
  sizeLimit: 64Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Variables extra (lista estándar de Kubernetes) y referencias a ConfigMap/Secret.
env: []
envFrom: []

# Telemetría OTLP. Vacío en otlpEndpoint = no se inyecta la configuración.
observability:
  serviceName: ""          # por defecto el fullname del release
  otlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4318"
  otlpProtocol: "http/protobuf"

# Para Spring Boot usa /actuator/health/liveness y /actuator/health/readiness.
probes:
  startup:
    path: /health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36
  readiness:
    path: /health
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []                # - host: api.midominio.com
                           #   paths:
                           #     - path: /
                           #       pathType: Prefix
  tls: []                  # - secretName: api-tls
                           #   hosts: [api.midominio.com]

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: null     # si se define, reemplaza a minAvailable
  unhealthyPodEvictionPolicy: AlwaysAllow

topologySpread:
  enabled: true            # reparte réplicas entre zonas y nodos

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []

# NetworkPolicy restrictiva (Zero-Trust): todo lo no listado queda denegado.
networkPolicy:
  enabled: true
  ingress:
    fromNamespaces:        # tráfico entrante permitido solo al puerto "http"
      - namespace: ingress-nginx
        podLabels: {}
    fromPods: []           # etiquetas de pods del MISMO namespace, ej. [{app.kubernetes.io/name: gateway}]
  egress:
    dns:
      enabled: true
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    otelCollector:
      enabled: true
      namespace: observability
      podLabels:
        app.kubernetes.io/name: opentelemetry-collector
      ports:
        - 4317
        - 4318
    cidrs: []              # ej. [{cidr: 10.0.0.0/16, ports: [443]}] para VPC endpoints de AWS
    extra: []              # reglas egress en formato nativo de NetworkPolicy
