# Valores para helm lint / helm template / chart-testing (ejercitan todas las plantillas).
image:
  repository: registry.example.com/demo-service
  tag: "1.0.0"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: demo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: demo-tls
      hosts:
        - demo.example.com

networkPolicy:
  ingress:
    fromPods:
      - app.kubernetes.io/name: gateway
  egress:
    cidrs:
      - cidr: 10.0.0.0/16
        ports:
          - 443
