name: cloud-devsecops-k8s-blueprint

x-security-defaults: &security-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Excepción documentada: LocalStack corre como root y sin rootfs read-only porque
  # escribe en múltiples rutas internas. Se mitiga con no-new-privileges, puertos
  # solo en loopback y límites de recursos.
  localstack:
    <<: *security-defaults
    image: localstack/localstack:3.8.1
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: "sqs,sns,s3,secretsmanager"
      DEBUG: "0"
      LS_LOG: "warn"
      PERSISTENCE: "0"
      EAGER_SERVICE_LOADING: "1"
      DISABLE_EVENTS: "1"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    pids_limit: 512
    networks:
      - platform

  # Imagen scratch (sin shell): no admite healthcheck interno.
  # Su salud se observa vía Prometheus (job otel-collector-apps).
  otel-collector:
    <<: *security-defaults
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    mem_limit: 512m
    pids_limit: 256
    networks:
      - platform

  prometheus:
    <<: *security-defaults
    image: prom/prometheus:v2.55.1
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_started
    mem_limit: 1g
    pids_limit: 256
    networks:
      - platform

  grafana:
    <<: *security-defaults
    image: grafana/grafana:11.3.1
    user: "472"
    read_only: true
    cap_drop:
      - ALL
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Falta GRAFANA_ADMIN_PASSWORD: ejecuta scripts/init-env.sh}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: "console"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 256
    networks:
      - platform

volumes:
  localstack-data:
  prometheus-data:
  grafana-data:

networks:
  platform:
    name: cloud-devsecops-net
    driver: bridge
